[Ad-Urls]
# Cloudflare Gateway 免费计划的实测额度是 300 个列表 × 1,000 条/列表，
# 约 30 万条。四份清单合并折叠后约 29.4 万条（295 个列表），刚好在额度内。
# 官方 Account limits 文档目前写的是 100 个列表，与实测不一致；脚本通过
# MAX_GATEWAY_LISTS 校验，账号实际额度更低时会在上传前停止。
Hagezi = https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/light-onlydomains.txt
Adguard = https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
217heidai = https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockdns.txt
anti-AD= https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-easylist.txt
